# Dependency policy for the public node release.  Every exception is reviewed
# in internal/11-operations/DEPENDENCY_AUDIT.md.

[advisories]
version = 2
unmaintained = "all"
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
