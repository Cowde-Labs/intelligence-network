[package]
name = "intelligence-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["cpu"]
cpu = ["intelligence-node/cpu"]
cuda = ["intelligence-node/cuda"]
rocm = ["intelligence-node/rocm"]
metal = ["intelligence-node/metal"]

[[bin]]
name = "intelligence"
path = "src/main.rs"

[dependencies]
clap.workspace = true
hex.workspace = true
intelligence-node = { path = "../node", default-features = false }
intelligence-protocol = { path = "../protocol" }
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
